<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDRGG — HDR Gaming Guide</title>
  <meta name="description" content="HDRGG (HDR Gaming Guide): проверенные настройки HDR и калибровки для игр.">

  <!-- Open Graph -->
  <meta property="og:title" content="HDRGG — HDR Gaming Guide">
  <meta property="og:description" content="HDRGG: калибровка PS5, HGiG и настройки HDR в играх.">
  <meta property="og:type" content="website">

  <style>
    /* Clean Authentic HDR Theme (OLED Pitch Black & HDR Gold — Zero Purple) */
    :root {
      --bg-black: #060709;
      --bg-surface: #0c0e14;
      --bg-card: #11141c;
      --bg-card-hover: #161b25;
      --border-subtle: #1c2230;

      /* HDR Gold & Accents */
      --hdr-gold: #f59e0b;
      --hdr-gold-bright: #fbbf24;
      --hdr-cyan: #38bdf8;
      --hdr-red: #ef4444;

      --text-white: #ffffff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--hdr-gold);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    /* Top Ambient Gold Edge */
    .hdr-edge {
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, #d97706, #fbbf24, #d97706);
      position: sticky;
      top: 0;
      z-index: 60;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
    }

    /* Single Clean Header — Zero Duplication */
    .header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1.75rem 1.25rem 1.5rem;
    }

    .header-container {
      max-width: 980px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .brand-title {
      font-size: 2.85rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: var(--text-white);
      line-height: 1;
    }

    .brand-subtitle {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--hdr-gold);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    /* Main Container */
    .main {
      max-width: 980px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 4rem;
      flex: 1;
      width: 100%;
    }

    /* Controls: Search & Filter Pills */
    .controls-panel {
      margin-bottom: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-white);
      padding: 0.85rem 1.15rem;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--hdr-gold);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.2);
      background: #0f121a;
    }

    .filter-pills {
      display: flex;
      gap: 0.55rem;
      overflow-x: auto;
      padding-bottom: 0.35rem;
      scrollbar-width: thin;
    }

    .filter-pill {
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 0.45rem 1.05rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.16s ease;
      letter-spacing: 0.02em;
    }

    .filter-pill:hover {
      border-color: var(--hdr-gold);
      color: var(--text-white);
      transform: translateY(-1px);
    }

    .filter-pill.active {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #000000;
      border-color: transparent;
      box-shadow: 0 2px 14px rgba(245, 158, 11, 0.4);
    }

    /* Games Grid — Clean, Compact Cards Without Description */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.25rem;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
      position: relative;
      overflow: hidden;
    }

    .game-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #f59e0b, #d97706);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-2px);
      border-color: rgba(245, 158, 11, 0.45);
      background: var(--bg-card-hover);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 14px rgba(245, 158, 11, 0.08);
    }

    .game-card:hover::before {
      opacity: 1;
    }

    .game-header {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .game-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-white);
      line-height: 1.25;
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.22rem 0.6rem;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-ps5 {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #cbd5e1;
    }

    .badge-calibration {
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: var(--hdr-gold-bright);
    }

    .badge-hgig {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--hdr-cyan);
    }

    .badge-broken {
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #f87171;
    }

    /* Single Clean Action Button */
    .card-action {
      margin-top: auto;
    }

    .btn-game-open {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      background: #161b26;
      color: var(--text-white);
      border: 1px solid var(--border-subtle);
      padding: 0.68rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      transition: all 0.16s ease;
      text-align: center;
    }

    .btn-game-open:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #000000;
      border-color: transparent;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    /* Footer */
    .footer {
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      padding: 1.75rem 1.25rem;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .footer strong {
      color: var(--text-white);
    }

    @media (max-width: 640px) {
      .brand-title {
        font-size: 2.35rem;
      }
      .games-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top Accent Edge -->
  <div class="hdr-edge"></div>

  <!-- Single Non-Duplicated Header: HDRGG with HDR Gaming Guide strictly beneath it -->
  <header class="header">
    <div class="header-container">
      <div class="brand">
        <h1 class="brand-title">HDRGG</h1>
        <div class="brand-subtitle">HDR Gaming Guide</div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Controls: Search & Filters -->
    <div class="controls-panel">
      <input type="text" id="gameSearch" class="search-input" placeholder="Поиск по названию игры (например, Spider-Man, Cyberpunk, Alan Wake)..." autocomplete="off">
      <div class="filter-pills">
        <button class="filter-pill active" data-filter="all">Все</button>
        <button class="filter-pill" data-filter="ps5">PS5</button>
        <button class="filter-pill" data-filter="ps5-calibration">PS5 Calibration</button>
        <button class="filter-pill" data-filter="hgig">HGIG</button>
        <button class="filter-pill" data-filter="broken-hdr">Broken HDR</button>
      </div>
    </div>

    <!-- Clean Games Grid (No Descriptions, Both PS5 Calibration & HGIG Badges on Supported Games) -->
    <div id="gamesGrid" class="games-grid"></div>
  </main>

  <footer class="footer">
    <p><strong>HDRGG</strong> • HDR Gaming Guide</p>
  </footer>

  <script>
    // Games Database: every game that supports PS5 system calibration has BOTH ps5-calibration and hgig tags and badges!
    const games = [
      {
        id: "cyberpunk-2077",
        title: "Cyberpunk 2077",
        platform: "PS5",
        statusTags: ["broken-hdr"],
        badges: [
          { type: "badge-ps5", label: "PS5" },
          { type: "badge-broken", label: "Broken HDR" }
        ],
        url: "games/cyberpunk-2077/"
      },
      {
        id: "spiderman-2",
        title: "Marvel's Spider-Man 2",
        platform: "PS5",
        statusTags: ["ps5-calibration", "hgig"],
        badges: [
          { type: "badge-ps5", label: "PS5" },
          { type: "badge-calibration", label: "PS5 Calibration" },
          { type: "badge-hgig", label: "HGIG" }
        ],
        url: "https://www.hdrgamer.com/2023/10/marvels-spider-man-2-hdr-settings.html"
      },
      {
        id: "spiderman-miles-morales",
        title: "Spider-Man: Miles Morales / Remastered",
        platform: "PS5",
        statusTags: ["ps5-calibration", "hgig"],
        badges: [
          { type: "badge-ps5", label: "PS5" },
          { type: "badge-calibration", label: "PS5 Calibration" },
          { type: "badge-hgig", label: "HGIG" }
        ],
        url: "https://www.hdrgamer.com/2022/02/marvels-spider-man-miles-morales-hdr.html"
      },
      {
        id: "god-of-war-ragnarok",
        title: "God of War Ragnarök",
        platform: "PS5",
        statusTags: ["ps5-calibration", "hgig"],
        badges: [
          { type: "badge-ps5", label: "PS5" },
          { type: "badge-calibration", label: "PS5 Calibration" },
          { type: "badge-hgig", label: "HGIG" }
        ],
        url: "https://www.hdrgamer.com/2022/11/god-of-war-ragnarok-hdr-settings.html"
      },
      {
        id: "ghost-of-tsushima",
        title: "Ghost of Tsushima Director's Cut",
        platform: "PS5",
        statusTags: ["ps5-calibration", "hgig"],
        badges: [
          { type: "badge-ps5", label: "PS5" },
          { type: "badge-calibration", label: "PS5 Calibration" },
          { type: "badge-hgig", label: "HGIG" }
        ],
        url: "https://www.hdrgamer.com/2022/02/ghost-of-tsushima-ps5-hdr-settings.html"
      },
      {
        id: "call-of-duty-bo6",
        title: "Call of Duty: Black Ops 6 (MW II / III)",
        platform: "PS5",
        statusTags: ["ps5-calibration", "hgig"],
        badges: [
          { type: "badge-ps5", label: "PS5" },
          { type: "badge-calibration", label: "PS5 Calibration" },
          { type: "badge-hgig", label: "HGIG" }
        ],
        url: "https://www.hdrgamer.com/2024/11/call-of-duty-black-ops-6-hdr-settings.html"
      },
      {
        id: "ratchet-and-clank",
        title: "Ratchet & Clank: Rift Apart",
        platform: "PS5",
        statusTags: ["ps5-calibration", "hgig"],
        badges: [
          { type: "badge-ps5", label: "PS5" },
          { type: "badge-calibration", label: "PS5 Calibration" },
          { type: "badge-hgig", label: "HGIG" }
        ],
        url: "https://www.youtube.com/watch?v=eNMEu1SCHe8"
      },
      {
        id: "horizon-forbidden-west",
        title: "Horizon Forbidden West",
        platform: "PS5",
        statusTags: ["ps5-calibration", "hgig"],
        badges: [
          { type: "badge-ps5", label: "PS5" },
          { type: "badge-calibration", label: "PS5 Calibration" },
          { type: "badge-hgig", label: "HGIG" }
        ],
        url: "https://www.youtube.com/watch?v=Kw8JuZEl8M0"
      },
      {
        id: "mortal-kombat-1",
        title: "Mortal Kombat 1",
        platform: "PS5",
        statusTags: ["ps5-calibration", "hgig"],
        badges: [
          { type: "badge-ps5", label: "PS5" },
          { type: "badge-calibration", label: "PS5 Calibration" },
          { type: "badge-hgig", label: "HGIG" }
        ],
        url: "https://www.youtube.com/watch?v=ZljIGLOtor4"
      },
      {
        id: "hogwarts-legacy",
        title: "Hogwarts Legacy",
        platform: "PS5",
        statusTags: ["ps5-calibration", "hgig"],
        badges: [
          { type: "badge-ps5", label: "PS5" },
          { type: "badge-calibration", label: "PS5 Calibration" },
          { type: "badge-hgig", label: "HGIG" }
        ],
        url: "https://www.youtube.com/watch?v=-p6TNxAV4P0"
      },
      {
        id: "alan-wake-2",
        title: "Alan Wake 2",
        platform: "PS5",
        statusTags: ["ps5-calibration", "hgig"],
        badges: [
          { type: "badge-ps5", label: "PS5" },
          { type: "badge-calibration", label: "PS5 Calibration" },
          { type: "badge-hgig", label: "HGIG" }
        ],
        url: "https://www.hdrgamer.com/2024/02/alan-wake-2-hdr-settings.html"
      }
    ];

    function renderGames(list) {
      const grid = document.getElementById('gamesGrid');
      if (!grid) return;

      grid.innerHTML = list.map(game => {
        const isExternal = game.url.startsWith('http');
        const targetAttr = isExternal ? 'target="_blank" rel="noopener noreferrer"' : '';
        const tagsString = game.statusTags.join(' ');

        const badgesHTML = game.badges.map(b =>
          `<span class="badge ${b.type}">${b.label}</span>`
        ).join('');

        return `
          <article class="game-card" data-platform="${game.platform.toLowerCase()}" data-tags="${tagsString}">
            <div class="game-header">
              <h2 class="game-title">${game.title}</h2>
              <div class="badges-row">
                ${badgesHTML}
              </div>
            </div>
            <div class="card-action">
              <a href="${game.url}" ${targetAttr} class="btn-game-open">Перейти к игре →</a>
            </div>
          </article>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderGames(games);

      const searchInput = document.getElementById('gameSearch');
      const filterPills = document.querySelectorAll('.filter-pill');

      const applyFilters = () => {
        const query = (searchInput?.value || '').toLowerCase().trim();
        const activePill = document.querySelector('.filter-pill.active');
        const filterVal = (activePill?.dataset.filter || 'all').toLowerCase();

        const cards = document.querySelectorAll('.game-card');

        cards.forEach(card => {
          const title = card.querySelector('.game-title')?.textContent.toLowerCase() || '';
          const platform = (card.dataset.platform || '').toLowerCase();
          const tags = (card.dataset.tags || '').toLowerCase().split(/\s+/);

          const matchesQuery = title.includes(query);
          let matchesFilter = false;

          if (filterVal === 'all') {
            matchesFilter = true;
          } else if (filterVal === 'ps5') {
            matchesFilter = platform === 'ps5';
          } else {
            matchesFilter = tags.includes(filterVal);
          }

          card.style.display = matchesQuery && matchesFilter ? 'flex' : 'none';
        });
      };

      if (searchInput) {
        searchInput.addEventListener('input', applyFilters);
      }

      filterPills.forEach(pill => {
        pill.addEventListener('click', () => {
          filterPills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          applyFilters();
        });
      });
    });
  </script>
</body>
</html>
