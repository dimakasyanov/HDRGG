<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDRGG — HDR Gaming Guide</title>
  <meta name="description" content="HDRGG (HDR Gaming Guide): проверенные настройки HDR, калибровки PS5 и HGiG для игр.">

  <!-- Open Graph -->
  <meta property="og:title" content="HDRGG — HDR Gaming Guide">
  <meta property="og:description" content="HDRGG: калибровка PS5, HGiG и настройки HDR в играх.">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Accent Edge -->
  <div class="hdr-edge"></div>

  <!-- Single Monolithic Header: HDRGG with HDR Gaming Guide strictly beneath -->
  <header class="header">
    <div class="header-container">
      <div class="brand">
        <h1 class="brand-title">HDRGG</h1>
        <div class="brand-subtitle">HDR Gaming Guide</div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Controls: Search & Filters -->
    <div class="controls-panel">
      <input type="text" id="gameSearch" class="search-input" placeholder="Поиск по названию игры (Cyberpunk 2077, Spider-Man 2)..." autocomplete="off">
      <div class="filter-pills">
        <button class="filter-pill active" data-filter="all">Все</button>
        <button class="filter-pill" data-filter="ps5">PS5</button>
        <button class="filter-pill" data-filter="ps5-calibration">PS5 Calibration</button>
        <button class="filter-pill" data-filter="hgig">HGIG</button>
        <button class="filter-pill" data-filter="broken-hdr">Broken HDR</button>
      </div>
    </div>

    <!-- Games Grid (populated from games.json; posters loaded from games/<id>/poster.webp) -->
    <div id="gamesGrid" class="games-grid"></div>

    <!-- Batched Pagination ("Показать ещё" when catalog > 20 games) -->
    <div id="loadMoreWrap" class="load-more-wrap" style="display: none;">
      <button id="loadMoreBtn" class="btn-load-more">Показать ещё</button>
    </div>
  </main>

  <footer class="footer">
    <p><strong>HDRGG</strong> • HDR Gaming Guide</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
